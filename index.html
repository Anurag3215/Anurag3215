<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anurag T S — System Interface</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #050816;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; }

  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
    text-align: center;
  }
  #overlay h1 {
    color: #F8FAFC;
    font-size: clamp(28px, 6vw, 64px);
    letter-spacing: 6px;
    margin: 0;
    text-shadow: 0 0 20px #00F5FF, 0 0 40px #8A2BE2;
  }
  #overlay p {
    color: #94A3B8;
    font-size: clamp(12px, 2vw, 16px);
    letter-spacing: 3px;
    margin-top: 10px;
    text-transform: uppercase;
  }
  #overlay .status {
    margin-top: 30px;
    color: #39FF14;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0.85;
  }
  #hint {
    position: fixed; bottom: 24px; width: 100%; text-align: center;
    color: #94A3B8; font-size: 11px; letter-spacing: 2px;
    opacity: 0.6; pointer-events: none;
  }
</style>
</head>
<body>

<div id="overlay">
  <h1>ANURAG T S</h1>
  <p>MERN Stack Developer · AngularJS Developer · Cybersecurity Enthusiast</p>
  <div class="status">● SYSTEM ONLINE — PARTICLE FIELD ACTIVE</div>
</div>
<div id="hint">move cursor to interact — scroll to zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.z = 600;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // Palette to blend across the particle field
  const palette = [
    new THREE.Color(0x00F5FF), // neon cyan
    new THREE.Color(0x8A2BE2), // neon purple
    new THREE.Color(0xFF007F), // electric pink
    new THREE.Color(0x39FF14), // neon green
    new THREE.Color(0xFFD300)  // warning yellow
  ];

  const PARTICLE_COUNT = 2200;
  const positions = new Float32Array(PARTICLE_COUNT * 3);
  const colors = new Float32Array(PARTICLE_COUNT * 3);
  const speeds = new Float32Array(PARTICLE_COUNT);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const radius = 300 + Math.random() * 500;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);

    positions[i * 3]     = radius * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = radius * Math.cos(phi);

    // Blend two random palette colors for variation while staying on-theme
    const c1 = palette[Math.floor(Math.random() * palette.length)];
    const c2 = palette[Math.floor(Math.random() * palette.length)];
    const mix = Math.random();
    const blended = c1.clone().lerp(c2, mix);

    colors[i * 3]     = blended.r;
    colors[i * 3 + 1] = blended.g;
    colors[i * 3 + 2] = blended.b;

    speeds[i] = 0.2 + Math.random() * 0.6;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 2.6,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const particles = new THREE.Points(geometry, material);
  scene.add(particles);

  // Soft connecting lines for a "circuit" feel (sparse, cheap)
  const lineGeometry = new THREE.BufferGeometry();
  const linePositions = [];
  for (let i = 0; i < 140; i++) {
    const a = Math.floor(Math.random() * PARTICLE_COUNT);
    const b = Math.floor(Math.random() * PARTICLE_COUNT);
    linePositions.push(
      positions[a * 3], positions[a * 3 + 1], positions[a * 3 + 2],
      positions[b * 3], positions[b * 3 + 1], positions[b * 3 + 2]
    );
  }
  lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
  const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00F5FF, transparent: true, opacity: 0.08 });
  const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
  scene.add(lines);

  // Mouse interaction
  let mouseX = 0, mouseY = 0;
  let targetRotX = 0, targetRotY = 0;

  document.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = (e.clientY / window.innerHeight) * 2 - 1;
  });

  document.addEventListener('wheel', (e) => {
    camera.position.z += e.deltaY * 0.4;
    camera.position.z = Math.max(200, Math.min(1400, camera.position.z));
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.002;

    targetRotY += (mouseX * 0.5 - targetRotY) * 0.03;
    targetRotX += (mouseY * 0.3 - targetRotX) * 0.03;

    particles.rotation.y = t + targetRotY;
    particles.rotation.x = targetRotX;
    lines.rotation.y = t + targetRotY;
    lines.rotation.x = targetRotX;

    // gentle pulsing size for a "living" feel
    material.size = 2.6 + Math.sin(t * 3) * 0.4;

    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
